<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festivales Náuticos MX</title>
  <meta name="description" content="Festivales Náuticos Mx, una organización...">
  <link rel="canonical" href="https://festivalesnauticos.com/">
  <!-- Open Graph -->
  <meta property="og:title" content="Festivales Náuticos MX">
  <meta property="og:description" content="Festivales Náuticos Mx, una organización...">
  <meta property="og:url" content="https://festivalesnauticos.com/">
  <meta property="og:image" content="images/banner-1.jpg">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Festivales Náuticos MX">
  <meta name="twitter:description" content="Festivales Náuticos Mx, una organización...">
  <meta name="twitter:image" content="images/banner-1.jpg">
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;700&family=Roboto+Slab:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- CSS Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/themes/base/jquery-ui.min.css" />
  <link rel="stylesheet" href="css/styles.css">
  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Festivales Náuticos MX",
    "url": "https://festivalesnauticos.com/",
    "logo": "images/logo.png",
    "event": [
      {
        "@type": "Event",
        "name": "Altares en el Mar 2025",
        "startDate": "2025-11-01",
        "endDate": "2025-11-04",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "eventStatus": "https://schema.org/EventScheduled",
        "location": {
          "@type": "Place",
          "name": "Cabo San Lucas, B.C.S.",
          "address": "Cabo San Lucas, Mexico"
        }
      },
      {
        "@type": "Event",
        "name": "Mar & Xmas 2025",
        "startDate": "2025-12-13",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "eventStatus": "https://schema.org/EventScheduled",
        "location": {
          "@type": "Place",
          "name": "Cabo San Lucas, B.C.S.",
          "address": "Cabo San Lucas, Mexico"
        }
      }
    ]
  }
  </script>
</head>
<body>
  <div id="loader" class="d-flex justify-content-center align-items-center">
    <img src="images/loader.gif" alt="Loader" />
  </div>

  <!-- Header -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand" href="#"><img src="images/logo.png" alt="Festivales Náuticos MX logo" height="40"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu" aria-controls="mobileMenu" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
            <li class="nav-item"><a class="nav-link" href="#altares" data-i18n="nav.altares"></a></li>
            <li class="nav-item"><a class="nav-link" href="#tourism" data-i18n="nav.tourism"></a></li>
            <li class="nav-item"><a class="nav-link" href="#sponsorship" data-i18n="nav.sponsorship"></a></li>
            <li class="nav-item"><a class="nav-link" href="#events" data-i18n="nav.events"></a></li>
            <li class="nav-item"><a class="nav-link" href="#gallery" data-i18n="nav.gallery"></a></li>
            <li class="nav-item"><a class="nav-link" href="#contact" data-i18n="nav.contact"></a></li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="langDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" data-i18n="nav.language"></a>
              <ul class="dropdown-menu" aria-labelledby="langDropdown">
                <li><a class="dropdown-item" href="#" data-set-lang="es">ES</a></li>
                <li><a class="dropdown-item" href="#" data-set-lang="en">EN</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu" aria-labelledby="mobileMenuLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="mobileMenuLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
          <li class="nav-item"><a class="nav-link" href="#altares" data-i18n="nav.altares"></a></li>
          <li class="nav-item"><a class="nav-link" href="#tourism" data-i18n="nav.tourism"></a></li>
          <li class="nav-item"><a class="nav-link" href="#sponsorship" data-i18n="nav.sponsorship"></a></li>
          <li class="nav-item"><a class="nav-link" href="#events" data-i18n="nav.events"></a></li>
          <li class="nav-item"><a class="nav-link" href="#gallery" data-i18n="nav.gallery"></a></li>
          <li class="nav-item"><a class="nav-link" href="#contact" data-i18n="nav.contact"></a></li>
        </ul>
        <hr>
        <div>
          <a href="#" class="me-2" data-set-lang="es">ES</a> |
          <a href="#" class="ms-2" data-set-lang="en">EN</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Banner (Revolution Slider) -->
    <section class="banner" aria-label="Main banner">
      <div id="rev_slider" class="rev_slider">
        <ul>
          <li data-transition="fade">
            <img src="images/banner-1.jpg" alt="Banner 1" class="rev-slidebg" data-bgfit="cover" data-bgposition="center center" />
            <div class="tp-caption" data-i18n="banner.headline" data-x="center" data-y="center" data-voffset="-50" data-start="500" data-transform_in="y:[-100%];opacity:0;s:500;"></div>
            <div class="tp-caption" data-x="center" data-y="center" data-voffset="20" data-start="800" data-transform_in="opacity:0;s:500;">
              <a href="#events" class="btn btn-cta" data-i18n="events.altares.cta"></a>
            </div>
          </li>
          <li data-transition="fade">
            <video class="rev-slidebg" autoplay muted loop>
              <source src="images/banner-video.mp4" type="video/mp4">
            </video>
            <div class="tp-caption" data-i18n="banner.headline" data-x="center" data-y="center" data-start="500"></div>
          </li>
        </ul>
      </div>
    </section>

    <!-- About Section -->
    <section id="about" class="section container">
      <div class="row align-items-center">
        <div class="col-md-6">
          <p data-i18n="about.paragraph"></p>
        </div>
        <div class="col-md-6">
          <img src="images/banner-2.jpg" alt="Sobre los eventos" class="img-fluid rounded" loading="lazy" decoding="async">
        </div>
      </div>
    </section>

    <!-- Events Section -->
    <section id="events" class="section container">
      <div class="row mb-5" id="altares">
        <div class="col-12 mb-3">
          <h2 data-i18n="events.altares.title"></h2>
          <p data-i18n="events.altares.info"></p>
          <p data-i18n="events.altares.dates"></p>
        </div>
        <div class="col-12">
          <div class="owl-carousel">
            <div class="item split-50-50">
              <img src="images/altares1.jpg" alt="Altares imagen 1" loading="lazy" decoding="async">
              <div>
                <p data-i18n="events.altares.cta"></p>
                <a href="images/altares-g1.jpg" data-fancybox="altares2024" class="btn btn-cta" data-i18n="events.altares.cta"></a>
              </div>
            </div>
            <div class="item split-50-50">
              <img src="images/altares2.jpg" alt="Altares imagen 2" loading="lazy" decoding="async">
              <div>
                <p data-i18n="events.altares.cta"></p>
                <a href="images/altares-g2.jpg" data-fancybox="altares2024" class="btn btn-cta" data-i18n="events.altares.cta"></a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row" id="marxmas">
        <div class="col-12 mb-3">
          <h2 data-i18n="events.marxmas.title"></h2>
          <p data-i18n="events.marxmas.info"></p>
          <p data-i18n="events.marxmas.dates"></p>
        </div>
        <div class="col-12">
          <div class="owl-carousel">
            <div class="item split-50-50">
              <img src="images/marxmas1.jpg" alt="Mar y Christmas imagen 1" loading="lazy" decoding="async">
              <div>
                <p data-i18n="events.marxmas.cta"></p>
                <a href="images/marxmas-g1.jpg" data-fancybox="marxmas2024" class="btn btn-cta" data-i18n="events.marxmas.cta"></a>
              </div>
            </div>
            <div class="item split-50-50">
              <img src="images/marxmas2.jpg" alt="Mar y Christmas imagen 2" loading="lazy" decoding="async">
              <div>
                <p data-i18n="events.marxmas.cta"></p>
                <a href="images/marxmas-g2.jpg" data-fancybox="marxmas2024" class="btn btn-cta" data-i18n="events.marxmas.cta"></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Tourism Section -->
    <section id="tourism" class="section bg-light">
      <div class="container">
        <h2 class="mb-4" data-i18n="nav.tourism"></h2>
        <p data-i18n="tourism.text"></p>
        <div class="row text-center">
          <div class="col-md-4 mb-3">
            <i class="fa-solid fa-ship fa-2x mb-2"></i>
            <p>Placeholder</p>
          </div>
          <div class="col-md-4 mb-3">
            <i class="fa-solid fa-fish fa-2x mb-2"></i>
            <p>Placeholder</p>
          </div>
          <div class="col-md-4 mb-3">
            <i class="fa-solid fa-umbrella-beach fa-2x mb-2"></i>
            <p>Placeholder</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Sponsorship Section -->
    <section id="sponsorship" class="section container">
      <h2 data-i18n="sponsorship.heading"></h2>
      <p data-i18n="sponsorship.info"></p>
    </section>

    <!-- Contact Form -->
    <section id="contact" class="section container">
      <form id="contact-form" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="name" class="form-label" data-i18n="sponsorship.form.name"></label>
            <input type="text" id="name" name="name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label" data-i18n="sponsorship.form.email"></label>
            <input type="email" id="email" name="email" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="phone" class="form-label" data-i18n="sponsorship.form.phone"></label>
            <input type="tel" id="phone" name="phone" class="form-control" pattern="[0-9\-\+\s]+">
          </div>
          <div class="col-12">
            <label for="message" class="form-label" data-i18n="sponsorship.form.message"></label>
            <textarea id="message" name="message" class="form-control" rows="5" required></textarea>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="1" id="consent" name="consent" required>
              <label class="form-check-label" for="consent" data-i18n="sponsorship.form.consent"></label>
            </div>
          </div>
          <div class="col-12">
            <div class="g-recaptcha" data-sitekey="YOUR_SITE_KEY"></div>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-cta" data-i18n="sponsorship.form.submit"></button>
          </div>
        </div>
        <div id="form-response" class="mt-3" role="alert"></div>
      </form>
    </section>

    <!-- Gallery -->
    <section id="gallery" class="section container">
      <h2 data-i18n="gallery.heading"></h2>
      <p data-i18n="gallery.text"></p>
      <div class="row g-3">
        <div class="col-6 col-md-3">
          <a href="images/altares-g1.jpg" data-fancybox="mix" data-caption="Altares 2024"><img src="images/altares-g1-thumb.jpg" class="img-fluid" alt="Altares 2024 1" loading="lazy" decoding="async"></a>
        </div>
        <div class="col-6 col-md-3">
          <a href="images/altares-g2.jpg" data-fancybox="mix" data-caption="Altares 2024"><img src="images/altares-g2-thumb.jpg" class="img-fluid" alt="Altares 2024 2" loading="lazy" decoding="async"></a>
        </div>
        <div class="col-6 col-md-3">
          <a href="images/marxmas-g1.jpg" data-fancybox="mix" data-caption="Mar y Christmas 2024"><img src="images/marxmas-g1-thumb.jpg" class="img-fluid" alt="Mar y Christmas 2024 1" loading="lazy" decoding="async"></a>
        </div>
        <div class="col-6 col-md-3">
          <a href="images/marxmas-g2.jpg" data-fancybox="mix" data-caption="Mar y Christmas 2024"><img src="images/marxmas-g2-thumb.jpg" class="img-fluid" alt="Mar y Christmas 2024 2" loading="lazy" decoding="async"></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white text-center py-4">
    <p data-i18n="footer.slogan"></p>
    <p data-i18n="footer.links"></p>
  </footer>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/revolution-slider/5.4.1/js/jquery.themepunch.revolution.min.js" defer></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="js/script.js" defer></script>
</body>
</html>
